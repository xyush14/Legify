<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--raise:#fcfcfb;
  --ink:#0c0c0a;--ink-2:#4b4b48;--ink-3:#8a8a82;--ink-4:#b8b6ae;
  --line:#e7e7e4;--line-2:#f1f1ef;--soft:#f6f6f4;
  --amber:#b7791f;--amber-soft:#fdf5e6;--amber-line:#eddcb8;
  --red:#b0392b;--red-soft:#fbeeec;--green:#2f8f57;--green-soft:#ecf6ef;--green-line:#cfe8d8;
  --r:10px;--r-lg:16px;--r-sm:8px;
  --shadow:0 1px 2px rgba(12,12,10,.05);--shadow-card:0 1px 2px rgba(12,12,10,.05),0 1px 1px rgba(12,12,10,.03);
  --lift:0 16px 34px -22px rgba(12,12,10,.26);--ease:cubic-bezier(.16,1,.3,1);
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--hi:'Noto Sans Devanagari','Geist',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input{font-family:inherit}
.mono{font-family:var(--mono)}.hi{font-family:var(--hi)}
::selection{background:#eaeae4}
.btn{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:.14s var(--ease);white-space:nowrap}
.btn:hover{border-color:#d4d2cb;background:var(--raise)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
.btn--primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn--primary:hover{background:#000}
.btn--sm{padding:7px 11px;font-size:12.5px}
.hidden{display:none!important}

/* shell */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.sb{border-right:1px solid var(--line);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--raise)}
.sb .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 20px}
.sbtog{margin-left:auto;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--ink-4);transition:.14s}
.sbtog:hover{background:#eeece5;color:var(--ink-2)}
.sbtog svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7}
/* collapsed sidebar */
body.sb-min .app{grid-template-columns:66px 1fr}
body.sb-min .sb{padding:20px 9px}
body.sb-min .sb .brand{padding:4px 0 20px;justify-content:center;position:relative}
body.sb-min .sb .brand .nm,body.sb-min .sb .lbl,body.sb-min .nvt,body.sb-min .sb .user>div:not(.av){display:none}
body.sb-min .sbtog{position:absolute;left:0;right:0;top:34px;margin:0 auto}
body.sb-min .navi{justify-content:center;padding:10px 0}
body.sb-min .navi .kbd{display:none}
body.sb-min .kbtn{justify-content:center;padding:10px 0;width:100%}
body.sb-min .sb .user{justify-content:center;padding:8px 0}
body.sb-min .sb .brand{margin-bottom:26px}
.sb .brand .mk{width:25px;height:25px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.sb .brand .nm{font-weight:600;font-size:17px;letter-spacing:-.02em}
.sb .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-4);margin:10px 10px 6px}
.navi{display:flex;align-items:center;gap:11px;padding:8px 11px;border-radius:var(--r-sm);color:var(--ink-2);font-size:13.5px;font-weight:500;width:100%;text-align:left;transition:.14s}
.navi svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;flex:none}
.navi:hover{background:#eeece5;color:var(--ink)}.navi.on{background:var(--ink);color:#fff}.navi.on svg{stroke:#fff}
.sb .kbtn{display:flex;align-items:center;gap:8px;margin:14px 4px 4px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);color:var(--ink-3);font-size:12.5px;background:var(--surface);width:calc(100% - 8px)}
.sb .kbtn:hover{border-color:#d4d2cb;color:var(--ink-2)}
.sb .kbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.sb .kbtn .k{margin-left:auto;font-family:var(--mono);font-size:10px;border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.navi .nvt{flex:1;text-align:left}
.sb .grow{flex:1}
.sb .user{display:flex;align-items:center;gap:9px;padding:8px;border-radius:var(--r-sm)}
.sb .user .av{width:29px;height:29px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
.sb .user .u{font-size:13px;font-weight:500;line-height:1.15}.sb .user .r{font-size:10.5px;color:var(--ink-3);font-family:var(--mono)}
.main{min-width:0}.mtop{display:none}
.wrap{padding:24px 32px 90px;max-width:1560px}

.hhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}
.hhead .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hhead h1{font-size:24px;font-weight:700;letter-spacing:-.025em;margin-top:5px}
.hhead .sub{font-size:13.5px;color:var(--ink-2);margin-top:6px}.hhead .sub b{color:var(--ink);font-weight:600}
.hhead .hacts{display:flex;gap:8px;flex:none}
.mtabs{display:none}

/* stat strip (demoted) */
.strip{display:flex;gap:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow-card);margin-bottom:16px}
.strip .s{flex:1;padding:12px 16px;border-right:1px solid var(--line-2);cursor:pointer;transition:.14s;display:flex;align-items:baseline;gap:8px}
.strip .s:last-child{border-right:0}
.strip .s:hover{background:var(--raise)}
.strip .s .n{font-size:19px;font-weight:700;letter-spacing:-.02em}
.strip .s .l{font-size:11.5px;color:var(--ink-3)}
.strip .s.warn .n{color:var(--amber)}
.strip .s .tag{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:999px;padding:2px 6px;align-self:center}
/* hero summary band (upper Home) — summary before detail */
.heroband{background:linear-gradient(180deg,#fbfbf8 0%,var(--surface) 60%);border:1px solid var(--line);border-radius:18px;padding:22px 26px;box-shadow:var(--shadow-card);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;margin-bottom:16px}
.hmain .hk{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hmain .hk svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.heroband{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.hverdict{display:flex;align-items:baseline;gap:4px;margin-top:14px;flex-wrap:wrap}
.hverdict .hv-n{font-size:58px;font-weight:700;letter-spacing:-.05em;line-height:.82;font-variant-numeric:tabular-nums}
.hverdict .hv-of{font-size:26px;font-weight:600;color:var(--ink-4);letter-spacing:-.03em;margin-right:12px}
.hverdict .hv-t{font-size:15px;color:var(--ink-2);font-weight:500}
.hgap{display:flex;align-items:center;gap:10px;width:100%;text-align:left;margin-top:16px;padding:11px 13px;border-radius:11px;border:1px solid var(--amber-line);background:var(--amber-soft);transition:.14s var(--ease)}
.hgap:hover{box-shadow:0 6px 16px -8px rgba(183,121,31,.5)}
.hgap .gi svg{width:17px;height:17px;stroke:var(--amber);fill:none;stroke-width:1.8;display:block}
.hgap .gt{flex:1;font-size:13px;color:#7d5514;min-width:0}.hgap .gt b{color:#5d3d0a;font-weight:600}
.hgap .gx{font-family:var(--mono);font-size:10.5px;color:var(--amber);white-space:nowrap}
.hgap.ok{border-color:var(--green-line);background:var(--green-soft);cursor:default}
.hgap.ok .gi svg{stroke:var(--green)}.hgap.ok .gt{color:#215f3b}
.hroute{display:flex;align-items:center;gap:7px;margin-top:16px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.hroute::-webkit-scrollbar{display:none}
.rt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:7px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);transition:.14s var(--ease);white-space:nowrap;position:relative}
.rt:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow-card)}
.rt::before{content:"";position:absolute;top:8px;right:8px;width:5px;height:5px;border-radius:50%}
.rt.ok::before{background:var(--green)}.rt.warn::before{background:var(--amber)}
.rt-c{font-size:12.5px;font-weight:600;letter-spacing:-.01em;padding-right:12px}
.rt-m{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.rt-a{color:var(--ink-4);font-size:12px;flex:none}
.hmain{min-width:0}
.hside{display:flex;min-width:0}
.hnotes{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;background:var(--raise);padding:16px 17px;display:flex;flex-direction:column}
.hn-k{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.hn-k svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.hn-s{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.55}.hn-s b{color:var(--ink);font-weight:600}
.hn-b{margin-top:14px;width:100%;justify-content:center}
.hn-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hn-f{font-family:var(--mono);font-size:10px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:999px;padding:3px 9px}
.hn-f.ok{color:var(--green);background:var(--green-soft);border-color:var(--green-line)}
.rn{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2)}
/* week nav (single date control) */
.wknav{display:flex;align-items:center;gap:6px}
.wkb{width:32px;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);display:grid;place-items:center;color:var(--ink-2);transition:.14s}
.wkb:hover{border-color:var(--ink);color:var(--ink)}
.wkb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9}
.wkt{height:34px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:12.5px;font-weight:500;color:var(--ink-2);transition:.14s}
.wkt:hover{border-color:var(--ink);color:var(--ink)}
.wkm{font-size:13.5px;font-weight:600;letter-spacing:-.01em;min-width:118px;text-align:center}
.dfil{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:3px;margin-left:auto}
.dfil button{border:0;background:transparent;color:var(--ink-3);font-family:var(--mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;font-weight:500;padding:6px 11px;border-radius:6px;transition:.15s}
.dfil button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cgrp{display:flex;align-items:center;gap:9px;padding:9px 16px;background:var(--raise);border-bottom:1px solid var(--line-2);position:sticky;top:0;z-index:2}
.cgrp .cn{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);font-weight:500}
.cgrp .cc{font-family:var(--mono);font-size:9px;color:var(--ink-4);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:1px 6px}
.showing{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.wkc{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-3);cursor:pointer}
.wkc svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.wkc input{border:0;outline:0;font-family:var(--mono);font-size:11.5px;color:var(--ink);background:transparent;width:112px;cursor:pointer}
/* prepared + assignee */
.prep{display:flex;flex-direction:column;gap:14px}
.prepchk{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);transition:.14s var(--ease)}
.prepchk:hover{border-color:var(--ink-3)}
.prepchk.on{border-color:var(--green-line);background:var(--green-soft)}
.pbox{width:20px;height:20px;border-radius:6px;border:1.6px solid var(--line);display:grid;place-items:center;flex:none;margin-top:1px;background:var(--surface)}
.prepchk.on .pbox{background:var(--green);border-color:var(--green)}
.pbox svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.6}
.prepchk .pl b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.prepchk.on .pl b{color:#215f3b}
.prepchk .pl small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px}
.asgk{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:7px}
.asgr{margin-bottom:8px}
.asgn{font-size:12.5px;color:var(--ink-4)}
.asgc{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;border:1px solid var(--line);border-radius:999px;padding:4px 5px 4px 4px;background:var(--surface)}
.asgc button{width:18px;height:18px;border-radius:50%;color:var(--ink-4);font-size:10px}
.asgc button:hover{background:var(--soft);color:var(--red)}
.av2{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:9.5px;font-weight:700;font-family:var(--mono)}
.av3{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;background:var(--soft);border:1px solid var(--line);color:var(--ink-2);font-size:8.5px;font-weight:700;font-family:var(--mono);margin-left:5px;vertical-align:2px}
.asgp{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.jchip{font-size:11.5px;color:var(--ink-2);border:1px dashed var(--line);border-radius:999px;padding:4px 10px;transition:.13s}
.jchip:hover{border-style:solid;border-color:var(--ink);color:var(--ink)}
.asgi{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12.5px;outline:0}
.asgi:focus{border-color:var(--ink)}
.prapwrap{border:1px solid var(--line);border-radius:13px;padding:14px 15px;background:var(--raise);max-width:520px}
/* diary row tick */
.tick{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;margin-right:8px;transition:.13s}
.tick:hover{border-color:var(--green)}
.tick.on{background:var(--green);border-color:var(--green)}
.tick svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.8}
/* note sheet switcher */
.nswitch{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--raise);margin-bottom:20px}
.nsw-l{display:flex;align-items:center;gap:11px}
.nsw-d{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.nsw-r{display:flex;gap:7px;flex-wrap:wrap;flex:1}
.nsw-e{font-size:12.5px;color:var(--ink-4)}
.nsw-r{align-items:center;gap:8px;flex:none}
.msel{height:34px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-family:inherit;font-size:13px;font-weight:500;color:var(--ink);padding:0 8px;max-width:260px;outline:0;cursor:pointer}
.msel:focus{border-color:var(--ink)}
.nsw-c{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
.wkb[disabled]{opacity:.35;cursor:default}
.wkb[disabled]:hover{border-color:var(--line);color:var(--ink-2)}
.mchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;background:var(--surface);transition:.14s var(--ease)}
.mchip:hover{border-color:var(--ink);color:var(--ink)}
.mchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mtick{color:var(--green);font-size:11px;font-weight:700}
.mchip.on .mtick{color:#8fe0aa}
/* ===== note sheet (document view) ===== */
.nsheet{max-width:880px}
.nhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start;padding-bottom:20px;border-bottom:2px solid var(--ink)}
.nhead .nk{font-family:var(--mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ntitle{font-size:24px;font-weight:700;letter-spacing:-.025em;margin:8px 0 9px;line-height:1.18}
.nmeta{display:flex;flex-wrap:wrap;gap:5px 16px;font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.npurpose{margin-top:11px;font-size:14px;color:var(--ink-2)}.npurpose b{color:var(--ink)}
.nsrc{display:inline-flex;align-items:center;gap:7px;margin-top:13px;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--green);background:var(--green-soft);border:1px solid var(--green-line);border-radius:999px;padding:4px 10px}
.nsrc svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8}
.nsrc.hand{color:#3f5ba8;background:#eef1fd;border-color:#d3dcf6}
.nsrc.warn{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line)}
.nacts{display:flex;flex-direction:column;gap:8px;flex:none}
.nacts .btn{justify-content:flex-start}
.nempty{border:1.5px dashed var(--line);border-radius:16px;background:var(--soft);padding:44px 28px;text-align:center;margin-top:24px}
.nempty .ic{width:48px;height:48px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 14px}
.nempty .ic svg{width:22px;height:22px;stroke:var(--ink-2);fill:none;stroke-width:1.6}
.nempty .et{font-size:17px;font-weight:600;letter-spacing:-.01em}
.nempty .es{font-size:13.5px;color:var(--ink-2);max-width:460px;margin:8px auto 18px;line-height:1.6}
.nempty .eb{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.ncount{font-family:var(--mono);font-size:9.5px;color:var(--ink-4);background:var(--soft);border-radius:5px;padding:1px 6px;letter-spacing:0}
.nsec{margin:26px 0}
.ntab{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ntr{display:grid;grid-template-columns:98px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.ntr:last-child{border-bottom:0}
.ntr .nd{font-family:var(--mono);font-size:11.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.ntr .nev{font-size:13.5px;color:var(--ink-2)}
.nsrc2{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--ink-4);border:1px solid var(--line);border-radius:999px;padding:2px 7px;white-space:nowrap}
.nsrc2.court{color:var(--green);border-color:var(--green-line);background:var(--green-soft)}
.npts{margin:0;padding-left:20px;counter-reset:p}
.npts li{font-size:14px;color:var(--ink);line-height:1.6;margin-bottom:11px;padding-left:4px}
.npts .pt{font-weight:450}
.pcite{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:9.5px;color:var(--green);background:var(--green-soft);border:1px solid var(--green-line);border-radius:999px;padding:2px 8px;margin-left:7px;white-space:nowrap;vertical-align:1.5px}
.pcite svg{width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:2.4}
.pcite.un{color:var(--amber);background:var(--amber-soft);border-color:var(--amber-line)}
.nhint{font-size:12px;color:var(--ink-3);margin-top:2px}
.nprov{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;flex-wrap:wrap}
.nprov .pv1{font-family:var(--mono);font-size:12.5px;font-weight:500;min-width:112px}
.nprov .pv2{font-size:13px;color:var(--ink-2);flex:1;min-width:140px}
.nopp{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.oprow{display:grid;grid-template-columns:1fr 1.25fr;gap:0;border-bottom:1px solid var(--line-2)}
.oprow:last-child{border-bottom:0}
.op-q{padding:12px 14px;font-size:13.5px;color:var(--ink-2);background:var(--amber-soft);border-right:1px solid var(--amber-line)}
.op-a{padding:12px 14px;font-size:13.5px;color:var(--ink)}
.npb{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pbr{display:flex;justify-content:space-between;gap:14px;padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:13.5px}
.pbr:last-child{border-bottom:0}.pbr .mono{color:var(--ink-3);font-size:11.5px}
.nask{margin:0;padding-left:20px}.nask li{font-size:13.5px;color:var(--ink-2);margin-bottom:6px}
.nafter textarea{width:100%;min-height:74px;border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13.5px;font-family:inherit;outline:0;resize:vertical}

.nar{display:flex;gap:9px;margin-top:10px;flex-wrap:wrap;align-items:center}
.nfoot{margin-top:28px;padding-top:16px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--ink-3);line-height:1.6}
/* scan / OCR review */
.scbox{width:min(660px,94vw);max-height:88vh;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 36px 80px -24px rgba(12,12,10,.44);display:flex;flex-direction:column;overflow:hidden}
.schead{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 20px 15px;border-bottom:1px solid var(--line-2)}
.scht{font-size:17px;font-weight:600;letter-spacing:-.015em;margin-top:4px}
.scbody{padding:18px 20px;overflow:auto}
.scdrop{border:1.5px dashed var(--line);border-radius:14px;background:var(--soft);padding:40px 24px;text-align:center;cursor:pointer;transition:.15s}
.scdrop:hover{border-color:var(--ink-3);background:#f2f2ef}
.scdrop .ic{width:46px;height:46px;border-radius:13px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 13px}
.scdrop .ic svg{width:21px;height:21px;stroke:var(--ink-2);fill:none;stroke-width:1.6}
.scdrop .st{font-size:16px;font-weight:600;letter-spacing:-.01em}
.scdrop .ss{font-size:13px;color:var(--ink-2);margin:7px auto 16px;max-width:340px;line-height:1.55}
.scdrop .sn{font-family:var(--mono);font-size:10px;color:var(--ink-4);margin-top:12px}
.scload{padding:52px 20px;text-align:center}
.scload .st{font-size:15.5px;font-weight:600;margin-top:16px}
.scload .ss{font-size:12.5px;color:var(--ink-3);margin-top:5px}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;margin:0 auto;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.scengine{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;color:var(--green);background:var(--green-soft);border:1px solid var(--green-line);border-radius:999px;padding:4px 11px}
.scengine svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.2}
.scnote{font-size:13px;color:var(--ink-2);margin:12px 0 14px;line-height:1.55}
.scrow{display:grid;grid-template-columns:26px minmax(0,1fr) 30px;gap:9px;align-items:center;margin-bottom:7px}
.scn{font-family:var(--mono);font-size:11px;color:var(--ink-4)}
.scin{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13.5px;outline:0}
.scin:focus{border-color:var(--ink)}
.scin.flagd{background:var(--amber-soft);border-color:var(--amber-line)}
.scx{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);color:var(--ink-4);font-size:11px}
.scx:hover{border-color:var(--red);color:var(--red)}
.scadd{font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px dashed var(--line);border-radius:8px;padding:7px 12px;margin-top:4px}
.scadd:hover{border-color:var(--ink-3);color:var(--ink-2)}
.scan-an{margin-top:20px;border:1px solid var(--line);border-radius:13px;padding:15px 16px;background:var(--raise)}
.anh{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:12px}
.anh svg{width:14px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:1.8}
.anr{display:flex;gap:10px;font-size:13px;color:var(--ink-2);line-height:1.55;padding:9px 0;border-top:1px solid var(--line-2)}
.anr:first-of-type{border-top:0}
.anr b{color:var(--ink);font-weight:600}
.anr .ai{flex:none;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;margin-top:1px}
.anr .ai svg{width:12px;height:12px;fill:none;stroke-width:2.2}
.anr.ok .ai{background:var(--green-soft)}.anr.ok .ai svg{stroke:var(--green)}
.anr.warn .ai{background:var(--amber-soft)}.anr.warn .ai svg{stroke:var(--amber)}
.scfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:18px;padding-top:15px;border-top:1px solid var(--line-2)}
.nsec .nh{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.nsec .nh svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;flex:none}
.nsec .nb{font-size:13.5px;color:var(--ink-2);line-height:1.62}
.nsec ul{margin:0;padding-left:17px}.nsec li{font-size:13.5px;color:var(--ink-2);line-height:1.6;margin-bottom:6px}
.nflag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.ncarry{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.ncarry:last-child{border-bottom:0}
.ncarry .cb{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--line);flex:none}
.ncarry.has .cb{background:var(--green);border-color:var(--green);position:relative}
.ncarry.has .cb::after{content:"✓";position:absolute;inset:0;color:#fff;font-size:10px;display:grid;place-items:center;font-weight:700}

/* HUB two-pane */
.hub{display:block}
.fband{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow-card);padding:13px 16px;margin-bottom:18px}
.fbh{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:11px}
.fbh svg{width:14px;height:14px;stroke:var(--amber);fill:none;stroke-width:1.8}
.fbn{font-family:var(--mono);font-size:9.5px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:999px;padding:1px 7px}
.fbl{display:flex;gap:9px;flex-wrap:wrap}
.fchip{display:flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);transition:.14s var(--ease);text-align:left}
.fchip:hover{border-color:var(--ink);transform:translateY(-1px);box-shadow:var(--shadow-card)}
.fchip .fi{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.fchip.log .fi{background:var(--red-soft)}.fchip.log .fi svg{stroke:var(--red)}
.fchip.date .fi{background:var(--amber-soft)}.fchip.date .fi svg{stroke:var(--amber)}
.fchip .fi svg{width:14px;height:14px;fill:none;stroke-width:1.8}
.fchip .fb{display:flex;flex-direction:column;min-width:0}
.fchip .ft{font-size:13px;font-weight:600;letter-spacing:-.01em}
.fchip .fs{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.lane .lane-h{display:flex;align-items:baseline;justify-content:space-between;margin:2px 2px 12px}
.lane .lane-h .t{font-size:16px;font-weight:600;letter-spacing:-.01em}
.lane .lane-h .c{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.cgroup{margin-bottom:14px}
.cghead{display:flex;align-items:center;gap:8px;padding:0 2px 8px}
.cghead .nm{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.cghead .ln{flex:1;height:1px;background:var(--line-2)}
.cgcard{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--shadow-card)}
.wrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .12s;position:relative}
.wrow:last-child{border-bottom:0}
.wrow:hover{background:var(--raise)}
.wrow .who{min-width:0}
.wrow .party{font-size:14.5px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.wrow .party .party-nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .meta{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow .right{display:flex;align-items:center;gap:10px}
.rdy{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;padding:3px 9px;border-radius:999px;white-space:nowrap}
.rdy i{width:5px;height:5px;border-radius:50%}
.rdy.ready{color:var(--green);background:var(--green-soft);border:1px solid var(--green-line)}.rdy.ready i{background:var(--green)}
.rdy.warn{color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line)}.rdy.warn i{background:var(--amber)}
.upnext{font-family:var(--mono);font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--ink);border-radius:5px;padding:2px 6px}
.wacts{display:flex;gap:3px;opacity:0;transition:.14s}
.wrow:hover .wacts{opacity:1}
.wacts button{width:29px;height:29px;border-radius:7px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-3);transition:.13s}
.wacts button:hover{border-color:var(--ink);color:var(--ink);background:#fff}
.wacts svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.chev{width:16px;height:16px;stroke:var(--ink-4);fill:none;stroke-width:1.7;flex:none}
.lane-empty{border:1.5px dashed var(--line);border-radius:var(--r-lg);background:var(--soft);padding:34px;text-align:center;color:var(--ink-3);font-size:13px}

/* right rail */
.rail{display:flex;flex-direction:column;gap:14px}
.rpanel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--shadow-card);overflow:hidden}
.rpanel .rh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.rpanel .rh .t{font-size:13.5px;font-weight:600;letter-spacing:-.01em}
.rpanel .rh .badge{font-family:var(--mono);font-size:10px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:999px;padding:2px 8px}
.rpanel .rh .badge.n{color:var(--ink-3);background:var(--soft);border-color:var(--line)}
.task{display:flex;align-items:center;gap:11px;padding:11px 16px;border-top:1px solid var(--line-2);cursor:pointer;transition:.12s}
.task:hover{background:var(--raise)}
.task .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:none}
.task .ic.log{background:var(--red-soft);color:var(--red)}.task .ic.date{background:var(--amber-soft);color:var(--amber)}.task .ic.draft{background:#eef1fd;color:#3f63c6}.task .ic.doc{background:var(--soft);color:var(--ink-2)}
.task .ic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.task .bd{flex:1;min-width:0}
.task .tt{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task .ts{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:1px}
.task .go{font-family:var(--mono);font-size:10px;color:var(--ink-4)}
.rempty{padding:20px 16px;text-align:center;color:var(--ink-3);font-size:12.5px;border-top:1px solid var(--line-2)}
.wk{display:flex;gap:5px;padding:12px 14px 14px}
.wk .d{flex:1;text-align:center;cursor:pointer;border-radius:8px;padding:6px 2px 7px;transition:.13s}
.wk .d:hover{background:var(--raise)}
.wk .dow{font-family:var(--mono);font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4)}
.wk .bar{height:34px;display:flex;align-items:flex-end;justify-content:center;margin:5px 0 4px}
.wk .bar span{width:70%;max-width:20px;background:var(--soft);border-radius:4px;min-height:3px}

.wk .d.today .bar span{background:var(--amber)}
.wk .num{font-size:11px;font-weight:600}
.wk .d.today .num{color:var(--amber)}
.recent{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid var(--line-2);cursor:pointer;transition:.12s}
.recent:hover{background:var(--raise)}
.recent .fo{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center;flex:none}
.recent .fo svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:1.7}
.recent .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.recent .mt{font-family:var(--mono);font-size:10px;color:var(--ink-3)}

/* ===== DIARY (reused component) ===== */
.diarysec{margin-top:28px}
.sect-lbl{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
.sect-lbl span{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink-2);font-size:13px;font-weight:500;padding:6px 14px;border-radius:7px;transition:.18s var(--ease)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.jump{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 10px;height:34px;background:var(--surface);color:var(--ink-3);font-size:12.5px}

.dsearch{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:0 12px;height:34px;background:var(--surface)}
.dsearch svg{width:14px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:1.7}
.dsearch input{border:0;outline:0;font-size:13px;width:100%;background:transparent}
.week{display:flex;gap:7px;margin-bottom:16px}
.week__d{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 4px 8px;text-align:center;cursor:pointer;background:var(--surface);transition:all .14s var(--ease)}
.week__d:hover{border-color:var(--ink-3);transform:translateY(-1px)}
.week__d.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.week__d.today .week__num{color:var(--amber)}.week__d.sel.today .week__num{color:#fff}
.week__dow{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3)}
.week__d.sel .week__dow{color:rgba(255,255,255,.6)}
.week__num{font-size:16px;font-weight:600;margin-top:3px}
.week__cnt{font-size:10px;color:var(--ink-3);margin-top:3px}.week__d.sel .week__cnt{color:rgba(255,255,255,.7)}
.undated-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--amber);background:var(--amber-soft);border:1px solid var(--amber-line);border-radius:999px;padding:5px 12px;cursor:pointer;margin-bottom:14px}
.undated-pill.sel{background:var(--amber);color:#fff;border-color:var(--amber)}
.daybar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.daybar .dt{font-size:15px;font-weight:600;letter-spacing:-.01em}
.daybar .dt small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--ink-3);margin-left:8px}
.daybar .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.ledger{border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;box-shadow:var(--shadow-card)}
.regrow{display:grid;grid-template-columns:26px 1fr .62fr 1.75fr .68fr .8fr 118px;gap:13px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line-2)}
.prepcol{display:flex;justify-content:flex-end}
.reghead .prepcol{justify-content:flex-end}
.tickb{display:inline-flex;align-items:center;gap:7px;padding:5px 10px 5px 7px;border:1px solid var(--line);border-radius:999px;background:var(--surface);transition:.14s var(--ease);white-space:nowrap}
.tickb:hover{border-color:var(--green);background:var(--green-soft)}
.tickb .tk{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;flex:none;background:var(--surface)}
.tickb .tk svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.8}
.tickb .tl{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.tickb:hover .tl{color:var(--green)}
.tickb.on{border-color:var(--green-line);background:var(--green-soft)}

.tickb.on .tl{color:var(--green)}
.regrow:last-child{border-bottom:0}
.reghead{background:var(--raise);font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
.lrow.regrow{transition:background .12s}.lrow.regrow:hover{background:var(--raise)}
.lrow__sl{font-family:var(--mono);font-size:12px;color:var(--ink-4)}
.rc-mono{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-name{font-size:14px;font-weight:600;letter-spacing:-.01em;min-width:0;cursor:pointer;display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.rc-name .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rc-name:hover{color:var(--green)}
.rc-name small{display:none;font-size:11px;font-weight:400;color:var(--ink-3);font-family:var(--mono)}
.rdot{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:9.5px;font-weight:500;padding:2px 7px;border-radius:999px;vertical-align:1px;margin-left:4px;letter-spacing:.02em;cursor:pointer}
.rdot i{width:4px;height:4px;border-radius:50%}
.rdot.ready{color:var(--green);background:var(--green-soft);border:1px solid var(--green-line)}.rdot.ready i{background:var(--green)}

.rc-prev{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.nxcell{display:flex;align-items:center;gap:6px}
.nxcell .val{font-family:var(--mono);font-size:11.5px;color:var(--ink);cursor:pointer;border-bottom:1px dashed var(--line);padding-bottom:1px}
.nxcell .val:hover{border-color:var(--ink-3)}
.nxcell .setnx{background:none;border:1px dashed var(--line);border-radius:6px;color:var(--ink-3);font-size:11px;padding:4px 8px;cursor:pointer;font-family:var(--mono)}

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MONF=['January','February','March','April','May','June','July','August','September','October','November','December'];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d);};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d);};
const fmtDay=s=>{const d=parse(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;};
const fmtLong=s=>{const d=parse(s);return `${DOW[d.getDay()]}, ${d.getDate()} ${MONF[d.getMonth()]} ${d.getFullYear()}`;};
const dmy=s=>{const d=parse(s);const p=n=>String(n).padStart(2,'0');return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()}`;};
const dmy2iso=v=>{const m=(v||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?`${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`:'';};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

          ${tile('research','Saved research','verified case-law',(e.authorities||[]).length||'')}
        </div>
        <div class="frail" style="margin-top:14px">${prepBlock(id)}</div>
      </div>
    </div>`;
  $('#homeView').classList.add('hidden');$('#noteView').classList.add('hidden');$('#folderView').classList.remove('hidden');closeSheet();window.scrollTo(0,0);
}
function closeCase(){$('#folderView').classList.add('hidden');$('#homeView').classList.remove('hidden');renderStrip();renderHub();window.scrollTo(0,0);}

/* ================= DIARY (reused register) ================= */
const REGHEAD=`<div class="regrow reghead"><div>#</div><div class="reg-hidem">Court · Judge</div><div class="reg-hidem">Case no.</div><div>Client · Party</div><div class="reg-hidem">Prev date</div><div>Next date</div><div class="prepcol">Prepared</div></div>`;
function renderDiary(){
  if(!$('#diaryApp')||!ALL.length)return;
  const days=windowDays();
  $('#diaryApp').innerHTML=`
   <div class="dtools">
     <div class="wknav">
       <button class="wkb" onclick="shiftWeek(-7)" title="Previous week" aria-label="Previous week">${S('<path d="m15 6-6 6 6 6"/>')}</button>
       <span class="wkm">${MONF[parse(weekAnchor).getMonth()]} ${parse(weekAnchor).getFullYear()}</span>
       <button class="wkb" onclick="shiftWeek(7)" title="Next week" aria-label="Next week">${S('<path d="m9 6 6 6-6 6"/>')}</button>
       <button class="wkt" onclick="setDay('${TODAY}')">Today</button>
     </div>
     <div class="dsearch">${S(IC.research)}<input id="dfilter" placeholder="Search this day — party, case no. or court…" oninput="renderBoard()"></div>
   </div>
   <div class="week">${days.map(d=>{const dt=parse(d.date);const sel=d.date===selDate,tod=d.date===TODAY;
      return `<div class="week__d${sel?' sel':''}${tod?' today':''}" onclick="setDay('${d.date}')"><div class="week__dow">${DOW[dt.getDay()]}</div><div class="week__num">${dt.getDate()}</div><div class="week__cnt">${d.count||'—'}</div></div>`;}).join('')}</div>
   <div id="undatedWrap"></div>
   <div class="daybar"><div class="dt" id="daylabel"></div>
     <div class="dfil">${[['all','All'],['notready','Not ready'],['prepared','Prepared']].map(f=>`<button class="${dMode===f[0]?'on':''}" onclick="setMode('${f[0]}')">${f[1]}</button>`).join('')}</div>
   </div>
   <div class="daybar" style="margin-top:-2px"><span class="showing" id="daycount"></span></div>
   <div class="ledger" id="board"></div>`;
  renderBoard();
}
function renderBoard(){
  const undated=ALL.filter(x=>x.date<TODAY&&!x.next_hearing_date);
  $('#undatedWrap').innerHTML=undated.length&&selDate!=='__undated'
    ?`<div class="undated-pill" onclick="setDay('__undated')">⚑ ${undated.length} matter(s) past their date with no next date — set one</div>`
    :(selDate==='__undated'?`<div class="undated-pill sel" onclick="setDay('${TODAY}')">⚑ Showing ${undated.length} missing a next date — back to today</div>`:'');
  const qv=(($('#dfilter')||{}).value||'').toLowerCase().trim();
  const all=dayItems();let items=all;
  if(qv)items=items.filter(c=>JSON.stringify(c).toLowerCase().includes(qv));
  if(dMode==='prepared')items=items.filter(c=>c.prepared);
  else if(dMode==='notready')items=items.filter(c=>!c.prepared&&deriveReadiness(c).state!=='ready');
  const rel=selDate==='__undated'?'':(selDate===TODAY?'Today':selDate===addDays(TODAY,-1)?'Yesterday':selDate===addDays(TODAY,1)?'Tomorrow':'');
  $('#daylabel').innerHTML=selDate==='__undated'?'Missing a next date':`${fmtLong(selDate)}${rel?` <small>${rel}</small>`:''}`;
  const prepN=all.filter(c=>c.prepared).length;
  $('#daycount').textContent=all.length?`Showing ${items.length} of ${all.length} · ${prepN} prepared`:'';
  if(!items.length){$('#board').innerHTML=`<div class="paneempty"><div class="ic">${S(IC.date)}</div>${all.length?'No matter matches this filter.':'Nothing listed for '+(selDate==='__undated'?'this filter':fmtDay(selDate))+'.'}<br><span style="font-size:12px">${all.length?'Try “All”, or clear the search.':'Shoot this day’s page to fill it.'}</span></div>`;return;}
  /* a busy board (30–40 matters) is grouped by court so it stays readable */
  if(items.length>12){
    const g={};items.forEach(c=>{(g[courtBase(c.court_name)]=g[courtBase(c.court_name)]||[]).push(c);});
    let n=0;
    $('#board').innerHTML=REGHEAD+Object.keys(g).sort().map(court=>
      `<div class="cgrp"><span class="cn">${esc(court)}</span><span class="cc">${g[court].length}</span></div>`+
      g[court].map(c=>lrow(c,n++)).join('')).join('');
  } else {
    $('#board').innerHTML=REGHEAD+items.map((c,i)=>lrow(c,i)).join('');
  }
}
function lrow(c,i){
  const court=esc(shortCourt(c.court_name)||'—'),cno=c.case_number?esc(c.case_number)+(c.case_year?'/'+esc(c.case_year):''):'—',prev=esc((c.case_json||{}).last_listed_date||'—');
  const nx=c.next_hearing_date?`<span class="val" onclick="editNx('${c.id}',${i})" title="Click to change">${esc(c.next_hearing_date)}</span>`:`<button class="setnx" onclick="editNx('${c.id}',${i})">+ set date</button>`;
  return `<div class="lrow regrow" id="row${i}">
    <div class="lrow__sl">${String(i+1).padStart(2,'0')}</div>
    <div class="rc-mono hi reg-hidem">${court}</div>
    <div class="rc-mono reg-hidem">${cno}</div>
    <div class="rc-name hi"><span class="pn" onclick="openCase('${c.id}')" title="Open folder">${esc(partyName(c))}</span>${c.assignee?`<span class="av3" title="Assigned to ${esc(c.assignee)}">${esc(initials(c.assignee))}</span>`:''}${EX[c.id]?rdyDot(c):''}<small>${cno} · ${court}</small></div>
    <div class="rc-prev reg-hidem">${prev}</div>
    <div class="nxcell" id="nx${i}">${nx}</div>
    <div class="prepcol"><button class="tickb ${c.prepared?'on':''}" onclick="togglePrepared('${c.id}',event)" title="${c.prepared?'Prepared — click to undo':'Mark this file prepared'}" aria-pressed="${!!c.prepared}"><span class="tk">${c.prepared?S('<path d="m5 12.5 4.5 4.5L19 7"/>'):''}</span><span class="tl">${c.prepared?'Prepared':'Mark ready'}</span></button></div>
  </div>`;
}
function editNx(id,i){
  const cell=$('#nx'+i);if(!cell)return;const cur=(dayItems().find(c=>c.id===id)||{}).next_hearing_date||'';
  cell.innerHTML=`<input type="date" id="nxi${i}" value="${dmy2iso(cur)}"><button class="ok" onclick="saveNx('${id}',${i})">${S('<path d="m5 12 5 5 9-11"/>')}</button>`;
  const el=$('#nxi'+i);el.focus();el.addEventListener('keydown',ev=>{if(ev.key==='Enter')saveNx(id,i);if(ev.key==='Escape')renderBoard();});
}
function saveNx(id,i){
  const el=$('#nxi'+i),v=el?el.value:'';if(!v){renderBoard();return;}
  const it=ALL.find(c=>c.id===id);if(it)it.next_hearing_date=dmy(v);
  renderStrip();renderHub();renderBoard();toast('Next date set · '+dmy(v),'success');
}

/* ================= nav ================= */
function setDay(d,fromHub){
  selDate=d;if(d!=='__undated'){const mo=mondayOf(d);if(mo!==weekAnchor)weekAnchor=mo;}
  renderDiary();
  if(fromHub){const ds=document.querySelector('.diarysec');if(window.matchMedia('(max-width:720px)').matches)switchTab('dash');if(ds)ds.scrollIntoView({behavior:'smooth',block:'start'});}
}
function jumpDate(v){if(!v)return;selDate=v;weekAnchor=mondayOf(v);renderDiary();}
function shiftWeek(n){weekAnchor=addDays(weekAnchor,n);selDate=weekAnchor;renderDiary();}
function switchTab(){}
function toggleSb(){const on=document.body.classList.toggle('sb-min');
  try{localStorage.setItem('hn_sb',on?'1':'0')}catch(e){}
  const b=$('#sbtog');if(b){b.title=on?'Expand sidebar':'Collapse sidebar';b.setAttribute('aria-label',b.title);}}
try{if(localStorage.getItem('hn_sb')==='1')document.body.classList.add('sb-min')}catch(e){}

/* ================= command palette ================= */
function openPal(){$('#pal').classList.add('on');$('#palq').value='';renderPal('');setTimeout(()=>$('#palq').focus(),30);}
function closePal(){$('#pal').classList.remove('on');}
function renderPal(q){
  q=(q||'').toLowerCase().trim();
  let list=ALL.slice();
  if(q)list=list.filter(c=>(partyName(c)+' '+c.case_number+'/'+c.case_year+' '+c.court_name).toLowerCase().includes(q));
  list=list.slice(0,8);
  $('#palres').innerHTML=list.length?list.map((c,i)=>`<div class="palr${i===0?' sel':''}" data-id="${c.id}" onclick="openCase('${c.id}');closePal()"><div class="fo">${S(IC.folder)}</div><div><div class="nm">${esc(partyName(c))}</div><div class="mt">${esc(c.case_number)}/${esc(c.case_year)} · ${esc(shortCourt(c.court_name))}</div></div></div>`).join(''):`<div class="palempty">No matter matches “${esc(q)}”.</div>`;
}
$('#palq').addEventListener('input',e=>renderPal(e.target.value));
$('#pal').addEventListener('click',e=>{if(e.target===$('#pal'))closePal();});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#pal').classList.contains('on')?closePal():openPal();}
  if(e.key==='Escape'){closePal();closeSheet();closeReady();}
  if($('#pal').classList.contains('on')&&e.key==='Enter'){const sel=$('#palres .palr.sel')||$('#palres .palr');if(sel){openCase(sel.dataset.id);closePal();}}
});

/* ================= boot ================= */
function skeleton(){
  $('#strip').innerHTML=`<div class="heroband"><div><div class="skl" style="height:12px;width:110px"></div><div class="skl" style="height:46px;width:170px;margin-top:14px"></div><div class="skl" style="height:14px;width:60%;margin-top:14px"></div></div></div>`;
  $('#hub').innerHTML=`<div class="lane"><div class="skl" style="height:18px;width:180px;margin-bottom:14px"></div><div class="cgcard">${'<div class="wrow"><div><div class="skl" style="height:15px;width:60%"></div><div class="skl" style="height:11px;width:40%;margin-top:8px"></div></div><div class="skl" style="height:22px;width:70px"></div></div>'.repeat(4)}</div></div><div class="rail"><div class="rpanel"><div class="rh"><div class="skl" style="height:14px;width:80px"></div></div>${'<div class="task"><div class="skl" style="height:28px;width:28px;border-radius:8px"></div><div style="flex:1"><div class="skl" style="height:13px;width:70%"></div></div></div>'.repeat(3)}</div></div>`;
  $('#hub').innerHTML+=`<div class="skl" style="height:34px;width:340px;margin:20px 0 14px"></div><div class="skl" style="height:58px;margin-bottom:16px"></div><div class="skl" style="height:180px;border-radius:14px"></div>`;
}
function boot(){
  document.body.classList.add('tab-dash');
  $('#hdate').textContent=fmtLong(TODAY).toUpperCase();skeleton();
  setTimeout(()=>{
    seed();
    renderStrip();renderHub();renderDiary();
  },520);
}
boot();
</script>
